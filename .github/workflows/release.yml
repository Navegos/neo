name: Neo Multi-Crate Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Matrix
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-riscv
            target: riscv64gc-unknown-linux-gnu

          # Windows Matrix
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc

          # macOS Matrix
          - os: xcode-27
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Cargo Versions
        id: meta
        shell: bash
        run: |
          VERSION=$(sed -E -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Sets up native Rust toolchain
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Compiler cache
      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: ${{ matrix.target }}

      # Ensure zstd and compression tools are available across platforms
      - name: Install Dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y zstd tar

      - name: Install Dependencies (macOS)
        if: startsWith(matrix.os, 'xcode') || startsWith(matrix.os, 'macos')
        run: |
          which zstd || brew install zstd

      - name: Install Dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        continue-on-error: true
        with:
          install: zstd tar

      # Compile all crates in the workspace in release mode
      - name: Compile Workspace Crates
        run: cargo build --release --target ${{ matrix.target }}

      # Packages all individual crates and the unified neo bundle
      - name: Package and Compress Distribution Assets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          EXE=""
          if [[ "${{ matrix.os }}" == windows* ]]; then
            EXE=".exe"
            if [ -d "/c/msys64/usr/bin" ]; then
              export PATH="/c/msys64/usr/bin:$PATH"
            fi
          fi

          TAR_CMD="tar"
          if command -v tar.exe >/dev/null 2>&1; then
            TAR_CMD="tar.exe"
          fi

          mkdir -p staging

          # 1. Package archinfo
          mkdir -p dist/archinfo
          cp target/$TARGET/release/archinfo$EXE dist/archinfo/
          cp crates/archinfo/LICENSE crates/archinfo/README.md dist/archinfo/ 2>/dev/null || true
          ARCHINFO_ARCHIVE="archinfo-${VERSION}-${TARGET}.tar.zst"
          $TAR_CMD -acvf "staging/$ARCHINFO_ARCHIVE" -C dist/archinfo .

          # 2. Package nbuild
          mkdir -p dist/nbuild
          cp target/$TARGET/release/nbuild$EXE dist/nbuild/
          cp -r crates/nbuild/catalog dist/nbuild/ 2>/dev/null || true
          cp crates/nbuild/LICENSE crates/nbuild/README.md dist/nbuild/ 2>/dev/null || true
          NBUILD_ARCHIVE="nbuild-${VERSION}-${TARGET}.tar.zst"
          $TAR_CMD -acvf "staging/$NBUILD_ARCHIVE" -C dist/nbuild .

          # 3. Package tokless
          mkdir -p dist/tokless
          cp target/$TARGET/release/tokless$EXE dist/tokless/
          cp crates/tokless/LICENSE crates/tokless/README.md dist/tokless/ 2>/dev/null || true
          TOKLESS_ARCHIVE="tokless-${VERSION}-${TARGET}.tar.zst"
          $TAR_CMD -acvf "staging/$TOKLESS_ARCHIVE" -C dist/tokless .

          # 4. Package unified neo multi-crate bundle (all tools in one distro)
          mkdir -p dist/neo/bin
          cp target/$TARGET/release/nbuild$EXE dist/neo/bin/
          cp target/$TARGET/release/tokless$EXE dist/neo/bin/
          cp target/$TARGET/release/archinfo$EXE dist/neo/bin/
          cp -r crates/nbuild/catalog dist/neo/ 2>/dev/null || true
          cp LICENSE README.md dist/neo/ 2>/dev/null || true
          NEO_ARCHIVE="neo-${VERSION}-${TARGET}.tar.zst"
          $TAR_CMD -acvf "staging/$NEO_ARCHIVE" -C dist/neo .

          # 5. Generate SHA256 checksums
          cd staging
          for f in *.tar.zst; do
            if [ -f "$f" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "${f}.sha256"
              else
                shasum -a 256 "$f" > "${f}.sha256"
              fi
            fi
          done

      # Upload compiled assets as build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            staging/*.tar.zst
            staging/*.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release & Crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Structured Release Notes
        shell: bash
        run: |
          python3 - << 'EOF'
          import subprocess
          import os
          import re

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          tag = os.environ.get("GITHUB_REF_NAME", "HEAD")

          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  stderr=subprocess.DEVNULL,
                  text=True
              ).strip()
              commit_range = f"{prev_tag}..{tag}"
              header_info = f"## What's Changed in `{tag}` (since `{prev_tag}`)\n\n"
          except Exception:
              commit_range = tag
              header_info = f"## What's Changed in `{tag}`\n\n"

          log_format = "%h%x1f%s%x1f%an"
          try:
              output = subprocess.check_output(
                  ["git", "log", commit_range, f"--pretty=format:{log_format}"],
                  text=True
              ).strip()
          except Exception:
              output = ""

          categories = {
              "Features": (r"^(feat)(\(.*?\))?!?:", []),
              "Bug Fixes": (r"^(fix)(\(.*?\))?!?:", []),
              "Performance Improvements": (r"^(perf)(\(.*?\))?!?:", []),
              "Refactor & Maintenance": (r"^(chore|refactor|build|ci|test|style)(\(.*?\))?!?:", []),
              "Documentation": (r"^(docs)(\(.*?\))?!?:", []),
              "Other Changes": (None, []),
          }

          if output:
              for line in output.split("\n"):
                  parts = line.split("\x1f")
                  if len(parts) < 2:
                      continue
                  h, s = parts[0], parts[1]
                  commit_link = f"[{h}](https://github.com/{repo}/commit/{h})" if repo else h
                  entry = f"- {s} ({commit_link})"

                  matched = False
                  for cat, (pattern, entries) in categories.items():
                      if pattern and re.search(pattern, s, re.IGNORECASE):
                          entries.append(entry)
                          matched = True
                          break
                  if not matched:
                      categories["Other Changes"][1].append(entry)

          notes = [header_info]
          non_empty = [cat for cat, (_, entries) in categories.items() if entries]

          if non_empty == ["Other Changes"]:
              notes.append("### Changes\n\n")
              for e in categories["Other Changes"][1]:
                  notes.append(f"{e}\n")
              notes.append("\n")
          elif non_empty:
              for cat in non_empty:
                  notes.append(f"### {cat}\n\n")
                  for e in categories[cat][1]:
                      notes.append(f"{e}\n")
                  notes.append("\n")
          else:
              notes.append("No commit changes recorded for this release.\n")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.writelines(notes)
          EOF

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: release-assets

      # Sets up native Rust toolchain for crate packaging and publishing
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Package each crate individually into .crate files
      - name: Package Crates for Crates.io
        run: |
          cargo package -p archinfo --allow-dirty --no-verify
          cargo package -p nbuild --allow-dirty --no-verify
          cargo package -p tokless --allow-dirty --no-verify
          cp target/package/*.crate release-assets/

      # Creates GitHub Release with structured release notes and all binary + crate assets
      - name: Upload Binaries and Crates to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish each crate individually to crates.io
      # Crates.io treats each crate as an entirely separate entity.
      # archinfo must be published first, followed by an index replication wait,
      # so nbuild can resolve the published archinfo dependency on crates.io.
      - name: Publish Crates Individually to Crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "=== 1. Publishing archinfo to crates.io ==="
          cargo publish -p archinfo --allow-dirty

          echo "Waiting 30 seconds for crates.io index update..."
          sleep 30

          echo "=== 2. Publishing nbuild to crates.io ==="
          cargo publish -p nbuild --allow-dirty

          echo "Waiting 30 seconds for crates.io index update..."
          sleep 30

          echo "=== 3. Publishing tokless to crates.io ==="
          cargo publish -p tokless --allow-dirty
