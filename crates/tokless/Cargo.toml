[package]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://github.com/Navegos/neo/blob/main/crates/tokless/README.md"
readme = "README.md"
description = "High-performance headroom proxy, token optimizer, and agent wire integration for AI coding agents"
name = "tokless"
default-run = "tokless"
keywords = ["tokens", "proxy", "ai-agents", "headroom", "llm"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = "1.13.1"
dirs = "7.0.0"
which = "8.0.6"
crossterm = "0.29.0"
tempfile = "3.27.0"
chrono = "0.4.45"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[[bin]]
name = "tokless"
path = "src/main.rs"


