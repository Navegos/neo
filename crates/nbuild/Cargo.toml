[package]
name = "nbuild"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universal toolchain manager, local workflow runner, and package engine for AI agents"
default-run = "nbuild"

[[bin]]
name = "nbuild"
path = "src/bin/nbuild.rs"

[[bin]]
name = "neo-build"
path = "src/bin/neo-build.rs"

[dependencies]
archinfo = { path = "../archinfo" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "cargo"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
which = "6"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
