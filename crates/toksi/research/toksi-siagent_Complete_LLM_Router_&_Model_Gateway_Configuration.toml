temperature = 1.0 # Gemini 4 & GPT-6 Astra standard reasoning baseline
top_p = 0.95 # Supports multi-branch consequence modeling and scenario rollouts
top_k = 40 # Trims extreme outliers while retaining plausible counterfactuals
architecture = ["World Model", "Hierarchical Planner", "Inference Engine"]

