# <toksi-siagent> Complete LLM Router & Model Gateway Configuration

# <toksi-siagent> uses all tools and services Out of the box ("off the back").

# <here_byok_profiles> here can be the full [[byok_profiles]] list or several or one from [[byok_profiles]]id.

[toksi_siagent_router]
gateway = "Model Gateway" # probably not necessary we have our Gateway internally.
router = "LLM Router"  # probably not necessary we have our LLM router and semantic-router internally.
default_fallback = "agy-adc-gemini-4-neon" # <here_byok_profiles>

# =====================================================================
# 1. META-COGNITION & GOVERNANCE (THE "SELF")
# =====================================================================

[toksi_siagent_router.1_meta_cognition_governance.orchestrate_route]
model_tier = "ultra-low-latency-classifier"
primary_model = "claude-haiku-5.5" # <here_byok_profiles>
fallback_model = "gpt-6-luna" # <here_byok_profiles>
reasoning_effort = "low"
temperature = 1.0 # Required baseline for Claude 5.5 / reasoning; determinism controlled via effort = "low"
top_p = 0.85 # Tight nucleus for consistent routing decisions
top_k = 20 # Caps low-probability tail tokens during route classification
architecture = ["Orchestrator", "LLM Router", "Model Gateway", "State Machine", "Event Bus", "Message Broker"]

[toksi_siagent_router.1_meta_cognition_governance.reflect_self_critique]
model_tier = "deep-reasoning-critic"
primary_model = "gpt-6-astra" # <here_byok_profiles>
fallback_model = "gemini-3.1-pro" # <here_byok_profiles>
reasoning_effort = "high"
temperature = 1.0 # Prevents token looping on Gemini 3.1 Pro & GPT-6 Astra reasoning paths
top_p = 0.95 # Preserves broad candidate space for thorough flaw/hallucination critique
top_k = 40 # Moderate tail cap to avoid erratic tokens during critique
architecture = ["Verification Engine", "Eval Harness", "Tracing Engine", "Telemetry Engine"]

[toksi_siagent_router.1_meta_cognition_governance.align_guardrail]
model_tier = "deterministic-policy-verifier"
primary_model = "claude-haiku-5.5" # <here_byok_profiles>
fallback_model = "gemini-3.1-flash-lite" # <here_byok_profiles>
reasoning_effort = "low"
temperature = 1.0 # Safe default for Gemini 3.1 Flash-Lite & Claude 5.5 policy verification
top_p = 0.8 # Narrow nucleus for conservative policy/safety verification
top_k = 15 # Strict candidate cap to keep guardrail evaluations predictable
architecture = ["Guardrails", "Policy-as-Code Engine", "IAM Attestation Layer", "Circuit Breaker", "Kill Switch", "HITL Gateway"]

[toksi_siagent_router.1_meta_cognition_governance.evolve_self_improve]
model_tier = "frontier-meta-architect"
primary_model = "claude-fable-5.2" # <here_byok_profiles>
fallback_model = "gpt-6-astra" # <here_byok_profiles>
reasoning_effort = "max"
temperature = 1.0 # Required when effort = "max" is active
top_p = 0.95 # Allows wide exploration of new skills, heuristics, and prompt revisions
top_k = 50 # Balanced cap for frontier architectural synthesis
architecture = ["Eval Harness", "Checkpointer", "Immutable Audit Log", "Tool Registry"]

# =====================================================================
# 2. MEMORY & WORLD MODELING
# =====================================================================

[toksi_siagent_router.2_memory_world_modeling.recall_retrieve]
model_tier = "retrieval-embedding-rerank"
embedding_model = "text-embedding-3-large" # <here_byok_profiles>
reranker_model = "cohere-rerank-v3.5" # <here_byok_profiles>
query_rewriter_model = "gpt-6-luna" # <here_byok_profiles>
reasoning_effort = "low"
top_p = 0.85 # Focused query rewriting without drifting from user intent
top_k = 20 # Limits query expansion noise
architecture = ["Context Store", "Episodic Memory", "Semantic Memory", "Vector Database", "Knowledge Graph", "Embedding Model", "Reranker", "Semantic Cache"]

[toksi_siagent_router.2_memory_world_modeling.consolidate_memorize]
model_tier = "structured-extraction-compression"
primary_model = "gemini-3.6-flash" # <here_byok_profiles>
fallback_model = "claude-sonnet-5.5" # <here_byok_profiles>
reasoning_effort = "medium"
temperature = 1.0 # Gemini 3.6+ ignores sub-1.0 values; Claude 5.5 requires 1.0 with effort enabled
top_p = 0.85 # Keeps memory extraction structured and faithful to session facts
top_k = 25 # Prevents noisy tokens when compressing into structured memory
architecture = ["Ingestion Pipeline", "Episodic Memory", "Semantic Memory", "Knowledge Graph", "Checkpointer"]

[toksi_siagent_router.2_memory_world_modeling.simulate_predict]
